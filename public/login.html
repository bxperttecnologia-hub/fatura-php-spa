<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aceda à sua conta BXpert." />
    <title>Acesso | BXpert</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/assets/css/app.css" />
    <style>
      :root { --auth-blue: #1688d4; }
      body { min-height: 100vh; background: #f7f8fa; }
      .auth-layout { min-height: 100vh; }
      .auth-form-column { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .auth-form { width: min(100%, 420px); padding: 2rem 1.25rem; }
      .auth-title { font-size: 2.2rem; font-weight: 700; color: #212529; }
      .auth-field { position: relative; margin-bottom: 1.5rem; }
      .auth-field label { position: absolute; z-index: 2; top: -.65rem; left: 1.4rem; padding: 0 .5rem; background: #f7f8fa; color: #6c757d; font-size: .8rem; font-weight: 600; }
      .auth-field input { height: 58px; padding: 0 3rem; border: 1px solid #dcdcdc; border-radius: 999px; background: #fff; }
      .auth-field input:focus { border-color: var(--auth-blue); box-shadow: 0 0 0 .2rem rgba(22,136,212,.1); }
      .auth-icon { position: absolute; top: 50%; z-index: 3; display: flex; color: #9aa0a6; transform: translateY(-50%); }
      .auth-icon-left { left: 1.1rem; }
      .auth-icon-right { right: 1.1rem; cursor: pointer; }
      .btn-auth { width: 100%; height: 52px; border: 0; border-radius: 999px; background: var(--auth-blue); color: white; font-weight: 600; }
      .btn-auth:hover { background: #0878c2; color: white; }
      .auth-link { color: var(--auth-blue); font-weight: 700; text-decoration: none; }
      .auth-brand { min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(circle at 25% 20%, #45b3ed 0, transparent 35%), linear-gradient(145deg, #007abd, #174fa7); color: white; }
      .auth-brand-content { max-width: 500px; padding: 3rem; text-align: center; }
      .auth-brand-mark { display: inline-grid; width: 104px; height: 104px; margin-bottom: 1.5rem; place-items: center; border: 1px solid rgba(255,255,255,.45); border-radius: 28px; background: rgba(255,255,255,.12); font-size: 2rem; font-weight: 800; letter-spacing: -.08em; }
      @media (max-width: 767.98px) { .auth-brand { display: none; } .auth-form-column { min-height: 100vh; } }
    </style>
  </head>
  <body>
    <main class="container-fluid">
      <div class="row auth-layout">
        <section class="col-12 col-md-6 auth-form-column">
          <div class="auth-form">
            <div class="text-center mb-4">
              <h1 class="auth-title mb-1">Acesso</h1>
              <span class="text-secondary">Conecte-se com a melhor do
                mercado.</span>
            </div>

            <div class="alert alert-danger text-center d-none" role="alert"
              id="error-message" aria-live="polite"></div>

            <form id="loginForm">
              <div class="auth-field">
                <label for="identifier">E-mail, utilizador ou telefone</label>
                <span class="auth-icon auth-icon-left"><i
                    class="material-icons-outlined">person</i></span>
                <input type="text" class="form-control" id="identifier"
                  name="identifier"
                  placeholder="E-mail, utilizador ou telefone"
                  autocomplete="username" autocapitalize="none" required />
              </div>

              <div class="auth-field">
                <label for="password">Palavra-passe</label>
                <span class="auth-icon auth-icon-left"><i
                    class="material-icons-outlined">lock</i></span>
                <input type="password" class="form-control" id="password"
                  name="password" placeholder="Digite a sua palavra-passe"
                  autocomplete="current-password" required />
                <button
                  class="auth-icon auth-icon-right border-0 bg-transparent"
                  id="togglePassword" type="button"
                  aria-label="Mostrar palavra-passe">
                  <i class="material-icons-outlined">visibility</i>
                </button>
              </div>

              <div class="form-check mb-4">
                <input type="checkbox" class="form-check-input" id="remember_me"
                  name="remember_me" />
                <label class="form-check-label" for="remember_me">Lembrar de
                  mim</label>
              </div>

              <button id="btnAcessar" class="btn btn-auth"
                type="submit">Acessar</button>
            </form>

            <div class="text-center mt-4">
              <p class="mb-0">Não tem uma conta? <a href="/register"
                  class="auth-link">Cadastre-se</a></p>
            </div>
          </div>
        </section>

        <aside class="col-md-6 auth-brand" aria-label="BXpert">
          <div class="auth-brand-content">
            <div class="auth-brand-mark">BX</div>
            <h2 class="display-5 fw-bold">BXpert</h2>
            <p class="lead mb-0">Gestão e facturação, simples e inteligente.</p>
          </div>
        </aside>
      </div>
    </main>
    <script type="module" src="/assets/js/auth.js"></script>
  </body>
</html>
