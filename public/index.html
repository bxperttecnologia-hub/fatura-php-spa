    <!-- Compat SPA (igual ao head.php da versão PHP): o código legado usa URLs relativos
         ('rh/ajax/x.php'); numa rota como /invoices/create resolveriam para /invoices/rh/...
         Reescreve-os para a raiz antes de qualquer outro script correr. -->
    <script>
      (function () {
        var abs = function (u) {
          return (typeof u === 'string' && u && !/^([a-z][a-z0-9+.\-]*:|\/|#|\?)/i.test(u))
            ? '/' + u.replace(/^(\.{1,2}\/)+/, '')
            : u;
        };
        var f = window.fetch;
        if (f) window.fetch = function (i, o) { return f.call(this, abs(i), o); };
        var x = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (m, u) {
          var a = [].slice.call(arguments); a[1] = abs(u); return x.apply(this, a);
        };
        window.__spaAbs = abs;
      })();
    </script>
