<div class="modal fade" id="modalRecebimento" tabindex="-1">
        <div class="modal-dialog">
            <form id="formRecebimento" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="recebimento-recibo">Recebimento / Recibo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" data-i18n="valor">Valor</label>
                        <div class="input-group">
                            <input type="number" step="0.01" min="0" id="rc_valor" name="amount" class="form-control" required>
                            <span class="input-group-text" id="rc_saldo"></span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="data">Data</label>
                        <input type="date" id="rc_data" name="receive_date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="serie">Série</label>
                        <select id="rc_serie" name="serie" class="form-select" required>
                            <option value="2025" data-i18n="2025">2025</option>
                            <option value="A" data-i18n="a">A</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="meio-de-recebimento">Meio de recebimento</label>
                        <select id="rc_meio" name="receive_method" class="form-select" required>
                            <option data-i18n="transferencia-bancaria">Transferência bancária</option>
                            <option data-i18n="dinheiro">Dinheiro</option>
                            <option data-i18n="cheque">Cheque</option>
                            <option data-i18n="tpa-cartao">TPA / Cartão</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="observacoes">Observações</label>
                        <textarea id="rc_obs" name="notes" rows="2" class="form-control"></textarea>
                    </div>
                    <input type="hidden" name="guide_id" value="">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success w-100" data-i18n="registar-recebimento-e-criar-recibo">
                        Registar recebimento e criar recibo
                    </button>
                </div>
            </form>
        </div>
    </div>
