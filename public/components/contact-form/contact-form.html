
<style>
    /* ===== STEP UI ===== */

    .step-content {
        display: none;
        animation: fadeSlide .3s ease;
    }

    .step-content.active {
        display: block;
    }

    @keyframes fadeSlide {
        from {
            opacity: 0;
            transform: translateX(15px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    /* Progress */
    .step-progress {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
        position: relative;
    }

    .step-progress::before {
        content: '';
        position: absolute;
        top: 50%;
        width: 100%;
        height: 3px;
        background: #e5e7eb;
        transform: translateY(-50%);
    }

    .step-bar {
        position: absolute;
        top: 50%;
        height: 3px;
        background: #007abd;
        width: 0%;
        transform: translateY(-50%);
        transition: .4s;
    }

    .step {
        z-index: 2;
        background: white;
        border: 2px solid #e5e7eb;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .step.active {
        background: #007abd;
        color: white;
        border-color: #007abd;
    }

    /* Aside fixo */
    .sticky-aside {
        position: sticky;
        top: 20px;
    }

    /* Buttons */
    .step-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
    }

    .btn-step {
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
    }

    .btn-next {
        background: #007abd;
        color: white;
    }

    .btn-prev {
        background: #e5e7eb;
    }

    #side-card {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
    }

    #side-card input,
    #side-card select,
    #side-card textarea {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        transition: 0.2s;
        font-size: .8rem !important;
        padding: 0px 10px !important;
        height: 20px !important;
    }

    /* Botão de notas (piscante enquanto não há notas) */
    .btn-notes {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #f59e0b;
        background: #fffbeb;
        color: #92400e;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: .85rem;
        font-weight: 600;
        animation: notesBlink 1.4s ease-in-out infinite;
    }

    .btn-notes .material-icons-round {
        font-size: 20px;
    }

    .btn-notes.has-notes {
        border-color: #16a34a;
        background: #f0fdf4;
        color: #166534;
        animation: none;
    }

    @keyframes notesBlink {

        0%,
        100% {
            box-shadow: 0 0 0 0 rgba(245, 158, 11, .55);
            opacity: 1;
        }

        50% {
            box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
            opacity: .55;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .btn-notes {
            animation: none;
        }
    }

    /* Modal: o corpo rola, o rodapé (botões de etapa) fica sempre visível */
    #contactFormModal .modal-content {
        border: 0;
        border-radius: 18px;
        overflow: hidden;
    }

    #contactFormModal .modal-footer .btn-step {
        min-width: 110px;
    }
</style>
