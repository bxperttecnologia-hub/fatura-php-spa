<div class="modal fade" id="modalPrintPreview" tabindex="-1" aria-labelledby="printPreviewTitle" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="printPreviewTitle">
                        <span class="material-icons-outlined align-middle me-1" data-i18n="print">print</span><span data-i18n="pre-visualizar-e-imprimir">
                        Pré-visualizar e imprimir
                    </span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <div class="modal-body p-0">
                    <div class="row g-0">
                        <!-- Escolha do formato -->
                        <div class="col-lg-4 p-3 border-end">
                            <p class="pp-label" data-i18n="formato">Formato</p>

                            <label class="pp-format">
                                <input type="radio" name="pp_format" value="a4" checked>
                                <span class="material-icons-outlined" data-i18n="description">description</span>
                                <span>
                                    <strong data-i18n="fatura-a4">Fatura A4</strong>
                                    <small data-i18n="pdf-em-folha-a4-com-original-e-duplicado">PDF em folha A4, com Original e Duplicado</small>
                                </span>
                            </label>

                            <label class="pp-format">
                                <input type="radio" name="pp_format" value="thermal">
                                <span class="material-icons-outlined" data-i18n="receipt-long">receipt_long</span>
                                <span>
                                    <strong data-i18n="talao-termico">Talão térmico</strong>
                                    <small data-i18n="rolo-de-80mm-impressora-pos">Rolo de 80mm (impressora POS)</small>
                                </span>
                            </label>

                            <div id="ppCopiesBox" class="mt-3">
                                <label class="pp-label" for="ppCopies" data-i18n="n-de-vias">Nº de vias</label>
                                <select id="ppCopies" class="form-select">
                                    <option value="1" data-i18n="1-via">1 via</option>
                                    <option value="2" selected data-i18n="2-vias-original-duplicado">2 vias (Original + Duplicado)</option>
                                    <option value="3" data-i18n="3-vias">3 vias</option>
                                </select>
                            </div>
                        </div>

                        <!-- Pré-visualização -->
                        <div class="col-lg-8 pp-stage">
                            <div id="ppLoading" class="pp-overlay">
                                <div class="spinner-border text-light" role="status" aria-hidden="true"></div>
                                <span data-i18n="a-preparar-a-pre-visualizacao">A preparar a pré-visualização...</span>
                            </div>
                            <div id="ppError" class="pp-overlay d-none">
                                <span class="material-icons-outlined" data-i18n="error-outline">error_outline</span>
                                <span id="ppErrorText"></span>
                                <button type="button" class="btn btn-light btn-sm" id="ppRetry" data-i18n="tentar-novamente">Tentar novamente</button>
                            </div>
                            <iframe id="ppFrame" title="Pré-visualização do documento"></iframe>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="fechar">Fechar</button>
                    <button type="button" class="btn btn-outline-primary" id="ppDownload" disabled>
                        <span class="material-icons-outlined align-middle" style="font-size:18px;" data-i18n="download">download</span><span data-i18n="baixar-pdf">
                        Baixar PDF
                    </span></button>
                    <button type="button" class="btn btn-primary" id="ppPrint" disabled>
                        <span class="material-icons-outlined align-middle" style="font-size:18px;" data-i18n="print">print</span><span data-i18n="imprimir">
                        Imprimir
                    </span></button>
                </div>
            </div>
        </div>
    </div>
